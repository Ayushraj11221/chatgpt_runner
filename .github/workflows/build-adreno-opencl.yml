name: Build llama.cpp Android Adreno OpenCL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential python3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Configure NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264"

          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Install OpenCL headers
        run: |
          git clone --depth 1 \
            https://github.com/KhronosGroup/OpenCL-Headers.git

          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cp -r OpenCL-Headers/CL "$SYSROOT/usr/include/"

      - name: Build Android OpenCL ICD loader
        run: |
          git clone --depth 1 \
            https://github.com/KhronosGroup/OpenCL-ICD-Loader.git

          cmake -S OpenCL-ICD-Loader -B opencl-loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DANDROID_STL=c++_shared \
            -DBUILD_TESTING=OFF

          cmake --build opencl-loader-build --parallel 2

          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cp opencl-loader-build/libOpenCL.so \
            "$SYSROOT/usr/lib/aarch64-linux-android/"

      - name: Download llama.cpp
        run: |
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Configure Android OpenCL + KleidiAI
        run: |
          cmake -S llama.cpp -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+fp16+dotprod+i8mm \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=ON

      - name: Compile llama.cpp
        run: |
          cmake --build build-android \
            --target llama-cli llama-server \
            --parallel 2

      - name: Package binaries and runtime
        run: |
          mkdir -p dist

          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBDIR="$SYSROOT/usr/lib/aarch64-linux-android"

          cp build-android/bin/llama-cli dist/
          cp build-android/bin/llama-server dist/
          cp "$LIBDIR/libOpenCL.so" dist/
          cp "$LIBDIR/libc++_shared.so" dist/

          printf '%s\n' \
            '/vendor/lib64/libOpenCL_adreno.so' > dist/adreno.icd

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d dist/llama-cli > dist/dependencies.txt

          cat > dist/README.txt <<'EOF'
          llama.cpp Android ARM64 Adreno OpenCL build

          Target: arm64-v8a
          CPU: ARMv8.2 + KleidiAI
          GPU: OpenCL + Adreno kernels

          Runtime:
          llama-cli
          llama-server
          libOpenCL.so
          libc++_shared.so
          adreno.icd

          Qualcomm GPU driver is provided by Android.
          EOF

          sha256sum dist/* > dist/SHA256SUMS
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-adreno-opencl-arm64
          path: dist/
          compression-level: 0
          retention-days: 7
