name: Build llama.cpp (Snapdragon 7s Gen 3 Safe + KleidiAI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          depth: 1

      - name: Configure CMake (ARMv8.2 + i8mm + dotprod + KleidiAI)
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+fp16+dotprod+i8mm \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile llama-cli & llama-server
        run: cmake --build build --target llama-cli llama-server -j$(nproc)

      - name: Package & Verify Checksum
        run: |
          mkdir -p dist
          cp build/bin/llama-cli build/bin/llama-server dist/
          llvm-strip dist/* 2>/dev/null || true
          sha256sum dist/*

      - name: Upload Artifact (Uncompressed Store Mode)
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-7sgen3-safe
          path: dist/
          compression-level: 0
